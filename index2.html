<!doctype html>

<style>
@font-face{font-family:Geist;src:url(node_modules/@fontsource/geist/files/geist-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Geist;src:url(node_modules/@fontsource/geist/files/geist-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:Geist;src:url(node_modules/@fontsource/geist/files/geist-latin-600-normal.woff2);font-weight:600}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#eef0f0;font-family:Geist,sans-serif;color:#0f1a1a}
.abs{position:absolute;left:0;top:0}
canvas{position:absolute;left:0;top:0}
.world{position:absolute;left:0;top:0;width:1286px;transform-origin:0 0;backface-visibility:hidden}
.world img{position:absolute;display:block}
.card{position:absolute;left:0;top:0;width:1286px;overflow:hidden;border-radius:14px;background:#f4f4f7;box-shadow:0 0 0 1px rgba(6,52,50,.07),0 2px 6px rgba(6,52,50,.05),0 24px 60px rgba(6,52,50,.10),0 60px 140px rgba(6,52,50,.10)}
.st{left:0;top:0;width:1286px;height:835px}
.patch{position:absolute}
svg.ov{position:absolute;left:0;top:0;overflow:visible}
.modal{position:absolute;transform-origin:50% 50%;border-radius:12px;box-shadow:0 0 0 1px rgba(6,40,40,.04),0 4px 12px rgba(6,40,40,.07),0 28px 70px rgba(6,40,40,.16)}
.modal img{left:0;top:0}
.sweep{position:absolute;overflow:hidden;display:none}
.sweep i{position:absolute;top:-20%;height:140%;width:110px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0));transform:skewX(-20deg)}
.head{position:absolute;left:0;width:1920px;text-align:center;font-weight:600;letter-spacing:-0.035em;line-height:1.04;transform-origin:960px 50%;will-change:transform;color:#0f1a1a}
.head span{display:inline-block;margin:0 .055em}
#wash{position:absolute;inset:0;background:#f6f7f7;opacity:0}
.rowimg{position:absolute;left:0;width:1286px}
.ring{position:absolute;border-radius:10px;box-shadow:0 0 0 1.5px rgba(6,90,88,.55),0 0 0 6px rgba(6,90,88,.08),0 8px 24px rgba(6,90,88,.18);opacity:0}
.hovrow{position:absolute;border-radius:12px;opacity:0;box-shadow:0 0 0 1px rgba(6,90,88,.28),0 14px 34px rgba(6,52,50,.14)}
.chip{position:absolute;height:84px;border-radius:42px;background:rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(6,52,50,.07),0 10px 30px rgba(6,52,50,.09);display:flex;align-items:center;gap:16px;padding:0 34px 0 22px;font-size:27px;font-weight:500;letter-spacing:-0.015em;white-space:nowrap;color:#0f1a1a;transform-origin:50% 50%}
.chip .ic{width:46px;height:46px;border-radius:50%;background:#e3f1ef;display:flex;align-items:center;justify-content:center}
#url{position:absolute;left:0;width:1920px;text-align:center}
#url span{display:inline-block;padding:14px 30px;border-radius:40px;background:#065a58;color:#fff;font-size:28px;font-weight:500;letter-spacing:-0.01em;box-shadow:0 12px 30px rgba(6,90,88,.25)}
</style></head>
